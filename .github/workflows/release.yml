name: Build official release draft

# Deliberately manual: normal pushes build Beta artifacts through ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: windows-latest
    environment: release
    timeout-minutes: 45
    env:
      YAOC_UPDATER_PUBLIC_KEY: ${{ vars.YAOC_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install GNU/LLVM Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnullvm --profile minimal --component rustfmt --component clippy
          rustup default stable-x86_64-pc-windows-gnullvm
          rustup target add aarch64-pc-windows-gnullvm
      - name: Install verified LLVM-MinGW UCRT
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip' -OutFile $archive
          $expected = 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'LLVM-MinGW checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $bin = (Get-ChildItem -LiteralPath $destination -Directory | Select-Object -First 1).FullName + '\bin'
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - run: npm audit
      - name: Audit locked Rust dependencies
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock
      - run: npm run check
      - run: npm test
      - run: npm run format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Build official executables
        run: npm run release
      - run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-gnullvm
      - run: cargo clippy --locked --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-gnullvm -- -D warnings
      - run: npm exec playwright install chromium
      - run: npm run test:browser
        env:
          YAOC_TEST_OFFICIAL: '1'
      - run: npm run notices
      - run: npm run package:installers
      - name: Create draft for manual testing and publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          gh release create "v$version" release/yaoc-x64.exe release/yaoc-arm64.exe release/yaoc-x64-setup.exe release/yaoc-arm64-setup.exe release/yaoc-x64-setup.exe.sig release/yaoc-arm64-setup.exe.sig release/installer-update.json release/SHA256SUMS.txt release/LICENSE release/THIRD_PARTY_LICENSES.txt --draft --title "YAOC $version" --target $env:GITHUB_SHA --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
