name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install GNU/LLVM Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnullvm --profile minimal --component rustfmt --component clippy
          rustup default stable-x86_64-pc-windows-gnullvm
          rustup target add aarch64-pc-windows-gnullvm
      - name: Install verified LLVM-MinGW UCRT
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip' -OutFile $archive
          $expected = 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'LLVM-MinGW checksum mismatch' }
          $destination = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $bin = (Get-ChildItem -LiteralPath $destination -Directory | Select-Object -First 1).FullName + '\bin'
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run format:check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-gnullvm
      - run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --package webview2-com-sys --lib --target x86_64-pc-windows-gnullvm
      - run: cargo clippy --locked --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-gnullvm -- -D warnings
      - run: npm run dist:all
      - run: npm exec playwright install chromium
      - run: npm run test:browser
      - run: npm run notices
      - run: npm run package:portable
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yaoc-windows-beta
          path: |
            release/yaoc-x64.exe
            release/yaoc-arm64.exe
            release/SHA256SUMS.txt
            release/LICENSE
            release/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
